name: Bug report
description: Something behaves differently from what it says it does.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Smallest reproduction
      description: >
        Code we can run. Prefer synthetic arrays over a data file; if the shape
        of real data matters, give the shapes and dtypes.
      render: python
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        Output of `python -c "import pulserver, sys, torch;
        print(pulserver.__version__, sys.version, torch.__version__,
        torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'cpu')"`
      render: shell
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Where it happens
      options: ["CPU only", "CUDA only", "Both"]
    validations:
      required: true
